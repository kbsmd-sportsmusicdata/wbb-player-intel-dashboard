project:
  title: "WBB Player Intel Dashboard"
  slug: "wbb-player-intel-dashboard"
  subtitle: "A static 2025-26 women's college basketball player-intel dashboard for role comps, team mix, and coach-facing scouting context."
  description: "This repo packages a publishable WBB player-intel dashboard that combines player profiles, role-based comps, team roster mix, and coach-facing prompts in a single portable HTML artifact."
  status: "approval-ready"
  sport: "Women's Basketball"
  league: "NCAA Division I"
  season: "2025-26"
  author: "Krystal Beasley"
  created_date: "2026-05-28"
  last_updated: "2026-05-28"

links:
  github_repo: "Pending repo creation"
  github_pages: "Pending GitHub Pages deployment"
  portfolio_page: "Not published yet"
  tableau_public: "Not used for this project"
  notion_page: ""

outputs:
  primary_deliverable: "Static HTML dashboard"
  notebook_path: "notebooks/index.html"
  dashboard_path: "notebooks/index.html"
  report_path: "docs/executive_summary.md"

project_context:
  problem_statement: "The source workspace contains a strong self-contained dashboard, but not a publish-ready repo contract. This child repo turns that artifact into a portable portfolio package while keeping the evidence bundle slim, exact-source aligned, and honest about what remains embedded directly in the HTML."
  audience:
    - "sports analytics portfolio reviewers"
    - "coaching staffs and scouting groups"
    - "front office and roster-construction decision-makers"
  use_cases:
    - "player evaluation"
    - "role-based comparison"
    - "team roster-mix review"
    - "coach-facing scouting prep"
  key_questions:
    - "Which 2025-26 players share the strongest role-based comp profiles across the dashboard universe?"
    - "How do percentile, role, and derived-metric layers translate into coach-facing player intel?"
    - "How can team roster mix and embedded coach Q&A surfaces support faster scouting review?"
  repo_usage_steps:
    - "Open `notebooks/index.html` first for the full player-intel dashboard experience."
    - "Use the exact-source JSON bundle in `data/processed/` to inspect the player, comp, and coaching layers behind the published artifact."
    - "Regenerate docs and rerun validation after any metadata or artifact refresh using the template scripts."

methodology:
  data_sources:
    - name: "dashboard_slim_k6_enriched.json"
      url: ""
      notes: "Exact-source player-intel layer mirrored into the published HTML. Includes player records, six-role taxonomy, percentiles, comps, and derived metrics."
    - name: "sample_comp_narratives.json"
      url: ""
      notes: "Comp-narrative library used for matchup and scouting text blocks embedded in the dashboard."
    - name: "coaching_implication_templates.json"
      url: ""
      notes: "Coaching-template rules used for the coach-facing interpretation layer embedded in the dashboard."
    - name: "Remote presentation dependencies"
      url: ""
      notes: "Google Fonts, Chart.js CDN, and ESPN-hosted logos/headshots remain runtime dependencies of the static dashboard."
  cleaning_steps:
    - "Copied the approved final HTML deliverable from `deliverables/WBB_PlayerIntelDashboard_v13.html` into `notebooks/index.html` without changing the artifact."
    - "Selected a slim public-safe evidence bundle of three exact-source JSON files and excluded heavier or taxonomy-drifted support outputs from the first publish pass."
    - "Initialized a fresh child repo from the sports analytics template scaffold and regenerated the repo-facing docs from this config."
  feature_engineering:
    - "Player profiles expose per-40 metrics, percentile views, role assignments, comp lists, and derived metrics embedded from `dashboard_slim_k6_enriched.json`."
    - "Coach-facing scouting panels layer in comp narratives and coaching templates from the two smaller JSON support files."
    - "Team-intel and coach Q&A surfaces are embedded directly inside the HTML artifact rather than shipped as separate public tables in this first publish pass."
  modeling_approach: "Not applicable. This repo packages a finished static analytics artifact rather than a training or model-building pipeline."
  validation_checks:
    - "HTML artifact exists at `notebooks/index.html` and matches the approved source deliverable."
    - "Expected evidence bundle files exist and JSON files parse successfully."
    - "Generated docs, README, and GitHub Pages scaffold files are present."
  embedded_layers:
    - "The published HTML embeds the player dataset, team-intel dataset, coaching templates, and comp narratives directly into the page."
    - "Because the dashboard is self-contained, the repo ships exact-source JSON evidence for the player, comp, and coaching layers rather than rebuilding a live app runtime."
  excluded_files:
    - "Excluded `data/player_box_with_game_type.json` from the public bundle because it is too large for a slim template repo."
    - "Excluded visible CSV derivatives from canonical evidence because their taxonomy drifts from the dashboard's six-role presentation."

metrics:
  primary_metrics:
    - name: "Points Per 40"
      definition: "Points scored per 40 minutes of playing time."
      interpretation: "Higher values indicate stronger scoring volume independent of raw playing-time totals."
    - name: "Rebounds Per 40"
      definition: "Total rebounds collected per 40 minutes."
      interpretation: "Higher values indicate stronger possession-ending and second-chance involvement."
    - name: "Assists Per 40"
      definition: "Assists created per 40 minutes."
      interpretation: "Higher values indicate stronger playmaking and table-setting value."
  derived_metrics:
    - name: "Assist-to-Turnover Ratio"
      formula: "Assists divided by turnovers."
      interpretation: "Higher values indicate stronger decision-making efficiency and ball security."
    - name: "Stocks Per 40"
      formula: "Steals per 40 plus blocks per 40."
      interpretation: "Higher values indicate stronger event creation and defensive disruption."
    - name: "Effective Field Goal Percentage"
      formula: "(FGM + 0.5 * 3PM) / FGA."
      interpretation: "Higher values indicate more efficient shot-making after accounting for three-point value."
    - name: "Usage Percentage"
      formula: "Embedded derived usage estimate from the source player-intel layer."
      interpretation: "Higher values indicate a player carries more offensive creation burden."

data:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  expected_files:
    - path: "data/processed/dashboard_slim_k6_enriched.json"
      required: true
      description: "Exact-source player-intel layer embedded in the dashboard."
    - path: "data/processed/sample_comp_narratives.json"
      required: true
      description: "Exact-source comp narrative library used in the scouting context layer."
    - path: "data/processed/coaching_implication_templates.json"
      required: true
      description: "Exact-source coaching template rules used in the coach-facing interpretation layer."
  required_columns: []
  included_files:
    - path: "data/processed/dashboard_slim_k6_enriched.json"
      classification: "Exact-source evidence"
      description: "Player, role, percentile, comp, and derived-metric layer mirrored into the HTML."
      notes: "Primary public evidence file for the dashboard."
    - path: "data/processed/sample_comp_narratives.json"
      classification: "Exact-source evidence"
      description: "Narrative comparison rules for player comps and scouting summaries."
      notes: "Supports the matchup-notes and structured scout-notes text blocks."
    - path: "data/processed/coaching_implication_templates.json"
      classification: "Exact-source evidence"
      description: "Role-usage coaching templates used in the coach-facing card and interpretation layer."
      notes: "Supports the coaching-brief and deployment framing embedded in the artifact."
  file_catalog:
    - file: "dashboard_slim_k6_enriched.json"
      description: "Top-level player-intel payload embedded into the dashboard HTML."
      fields:
        - name: "p[].id"
          type: "integer"
          description: "Unique athlete identifier for each player record."
          source: "Embedded player layer"
          calculation: "Not applicable"
          notes: "Used for profile, comp, and navigation lookups."
        - name: "p[].n"
          type: "string"
          description: "Player display name."
          source: "Embedded player layer"
          calculation: "Not applicable"
          notes: "Primary player label in the dashboard."
        - name: "p[].r"
          type: "string"
          description: "Assigned six-role taxonomy label for the player."
          source: "Embedded player layer"
          calculation: "Upstream role classification"
          notes: "Examples include Shot Creator, Interior Anchor, and Perimeter Contributor."
        - name: "p[].s.points_per40"
          type: "float"
          description: "Points scored per 40 minutes."
          source: "Embedded player stat layer"
          calculation: "Scoring output normalized to 40 minutes"
          notes: "One of the main profile and comp metrics."
        - name: "p[].p.points_per40.rp"
          type: "float"
          description: "Role-peer percentile for points per 40."
          source: "Embedded percentile layer"
          calculation: "Percentile within the assigned role bucket"
          notes: "Used in the profile percentile bars."
        - name: "p[].d.USG_pct"
          type: "float"
          description: "Embedded usage estimate for the player."
          source: "Derived metric layer"
          calculation: "Upstream derived metric"
          notes: "Used for deployment and identity interpretation."
        - name: "cl"
          type: "object"
          description: "Cluster-to-role label map for the six dashboard roles."
          source: "Embedded taxonomy layer"
          calculation: "Not applicable"
          notes: "Defines the role labels rendered throughout the artifact."
    - file: "sample_comp_narratives.json"
      description: "Comp-level narrative records used to enrich matchup notes and coaching context."
      fields:
        - name: "base_player_name"
          type: "string"
          description: "Name of the primary player in the comp pair."
          source: "Comp narrative layer"
          calculation: "Not applicable"
          notes: "Combined with `comp_player_name` to form the lookup key."
        - name: "comp_player_name"
          type: "string"
          description: "Name of the comparison player."
          source: "Comp narrative layer"
          calculation: "Not applicable"
          notes: "Rendered in the comp card and scouting layers."
        - name: "similarity_score"
          type: "float"
          description: "Similarity score for the comp pair."
          source: "Comp narrative layer"
          calculation: "Upstream comp scoring output"
          notes: "Higher values indicate a tighter comp."
        - name: "edge_dimension"
          type: "string"
          description: "Dimension used to describe the key separation between the two players."
          source: "Comp narrative layer"
          calculation: "Narrative selection rule"
          notes: "Used in matchup-note framing."
        - name: "coaching_takeaway"
          type: "string"
          description: "Coach-facing interpretation of the comp pair."
          source: "Comp narrative layer"
          calculation: "Narrative authoring layer"
          notes: "Feeds the coaching context callout."
    - file: "coaching_implication_templates.json"
      description: "Role and deployment templates used to create coach-facing interpretation cards."
      fields:
        - name: "template_id"
          type: "string"
          description: "Unique identifier for the coaching template."
          source: "Coaching template layer"
          calculation: "Not applicable"
          notes: "Primary key for the template library."
        - name: "role_label"
          type: "string"
          description: "Role taxonomy label the template applies to."
          source: "Coaching template layer"
          calculation: "Not applicable"
          notes: "Aligned to the dashboard role system."
        - name: "usage_tier"
          type: "string"
          description: "Usage bucket expected for the template."
          source: "Coaching template layer"
          calculation: "Template rule"
          notes: "Used in template matching."
        - name: "efficiency_tier"
          type: "string"
          description: "Efficiency bucket expected for the template."
          source: "Coaching template layer"
          calculation: "Template rule"
          notes: "Used in template matching."
        - name: "best_used_as"
          type: "string"
          description: "Recommended role or deployment framing."
          source: "Coaching template layer"
          calculation: "Template authoring"
          notes: "Displayed in the coaching brief block."
        - name: "primary_caution"
          type: "string"
          description: "Primary caution attached to the role/deployment template."
          source: "Coaching template layer"
          calculation: "Template authoring"
          notes: "Displayed as the main caution in the coaching layer."

validation:
  fail_on_missing_required_files: true
  fail_on_duplicate_rows: false
  fail_on_missing_values: false
  max_missing_pct_warning: 20

publishing:
  deploy_github_pages: true
  pages_source: "notebooks/index.html"
  include_validation_badge: true
  include_methodology_link: true
  include_data_dictionary_link: true

notes:
  limitations:
    - "This repo ships a static dashboard and a slim exact-source evidence bundle, not the full upstream build workspace."
    - "Remote presentation assets still rely on Google Fonts, Chart.js CDN, and ESPN-hosted logos/headshots."
    - "The team-intel and coach-Q&A views are embedded inside the HTML artifact rather than exposed as separate public tables in this first publish pass."
    - "Visible CSV derivatives from the source folder were intentionally excluded because their taxonomy does not cleanly match the shipped dashboard."
  next_steps:
    - "Review the packaged repo locally and approve the public-facing narrative before creating the GitHub repository."
    - "After approval, create the destination GitHub repo and push this local child repo."
    - "Optionally add curated CSV appendix tables in a second pass if taxonomy is normalized or clearly labeled as non-canonical."

narrative:
  decision_support_value: "This project turns a strong scouting dashboard into a portable review asset. For coaching staffs, scouts, and roster-build readers, it surfaces role identity, comp logic, team-mix context, and coach-facing prompts quickly enough to support triage and comparison work."
  top_findings:
    - "The approved HTML artifact is already largely self-contained, with the player, team, comp, and coaching layers embedded directly into the page."
    - "A slim exact-source JSON bundle is enough to document the player, comp, and coaching evidence without shipping the full upstream workspace or the heavy game-log JSON."
    - "Visible CSV derivatives were intentionally left out of the canonical evidence bundle because their taxonomy drifts from the dashboard's six-role presentation."
